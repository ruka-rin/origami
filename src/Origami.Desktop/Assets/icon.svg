<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    折纸谜题工具 —— 程序图标。

    主题：「一张纸被折叠」：白纸上一道红（峰）蓝（谷）交替的折返，
    右上角翻起一角露出背面。红蓝取自程序自身方形折痕图的配色，
    与程序输出属同一套视觉语言。

    **不画深色底板，也不画外边框**：
    窗口默认就是深色主题，标题栏背景与程序底色同深。深色底板放在深色
    标题栏里等于「黑方块里画白纸」—— 边框成了唯一可见的轮廓，厚且难看。
    真正可靠的边界是**纸本身**：白纸在深色与浅色背景上都能自己立住，
    折痕又是高饱和的红蓝，天然有对比度，不依赖底板。

    线条刻意加粗（26）：图标要在 16×16 任务栏尺寸下仍可辨，
    细于 14 就会在缩放中消失。折返而非交叉：交叉会看起来像「X」。

    不画具体母版：KRENIO 那类 100 格母版有 76 条折痕 + 100 条剪切线，
    在 16px 下会糊成一片杂色。图标只保留最能说明问题的元素。
  -->

  <defs>
    <!-- 翻起纸角的背面：比正面暗一档，拉开前后层次 -->
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFD5DE"/>
      <stop offset="1" stop-color="#A8B0BC"/>
    </linearGradient>
  </defs>

  <!--
    纸。四周只留 52px 边距 —— 让纸尽可能占满画面：
    深色标题栏里图标显示得小，边距太宽纸就太小、折痕糊成一团。
    不画描边：白纸自身已足够界定形状，描边反而成了「厚边框」。
  -->
  <rect x="52" y="52" width="408" height="408" rx="22" fill="#FAFBFC"/>

  <!--
    折痕：方形折痕图里每个折痕单元都是一对反向45°线，
    按「之」字形连续排布。红=峰（山折）、蓝=谷（谷折）交替。
  -->
  <g stroke-width="27" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 第一条折返：红→蓝 -->
    <path d="M104 226 L204 126 L304 226" stroke="#E02020"/>
    <path d="M304 226 L404 126" stroke="#1A34D0"/>

    <!-- 第二条折返：蓝→红→蓝 -->
    <path d="M104 326 L204 226" stroke="#1A34D0"/>
    <path d="M204 226 L304 326" stroke="#E02020"/>
    <path d="M304 326 L404 226" stroke="#1A34D0"/>

    <!-- 第三条折返 -->
    <path d="M154 396 L254 296" stroke="#E02020"/>
    <path d="M254 296 L354 396" stroke="#1A34D0"/>
  </g>

  <!--
    翻起的纸角：右上角折起，露出背面。
    这是「折叠」最直观的符号 —— 纸真的被折起来了。
    高光用纸白色，压在折痕之上让折角更立体。
  -->
  <path d="M312 52 L460 52 L460 200 Z" fill="url(#back)"/>
  <path d="M312 52 L460 200" stroke="#FFFFFF" stroke-width="13"
        stroke-linecap="round" fill="none"/>
</svg>