<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    折纸谜题工具 —— 程序图标。

    主题：「一张纸被折叠」。取自程序自身的视觉语言 ——
    方形折痕图上的红（峰）/ 蓝（谷）对角线，以及折叠后翻起的纸角。
    底板深色圆角方块与程序深色主题一致。

    刻意不画某个具体母版：KRENIO 那类 100 格母版折痕有 76 条，
    在 16×16 的任务栏尺寸下会糊成一片杂色。图标要一眼可认，
    因此只保留最能说明问题的元素 —— 对角线折痕与翻起的纸角。
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2C2C36"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>

    <!-- 翻起纸角的背面：略暗，与正面拉开层次 -->
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9CFD8"/>
      <stop offset="1" stop-color="#A9B0BC"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="5" y="5" width="502" height="502" rx="114"
        fill="none" stroke="#3C3C47" stroke-width="7"/>

  <!-- 纸面 -->
  <rect x="92" y="92" width="328" height="328" rx="18" fill="#F7F8FA"/>

  <!--
    折痕：方形折痕图里每个折痕单元都是一对反向的 45° 线，
    按「之」字形连续排布 —— 红=峰（山折）、蓝=谷（谷折）交替，
    与程序输出（SvgIO 的配色常量）一致。
    线宽 22 是为 16×16 下的可辨识度：细于 12 就会消失。
    交叉排列会看起来像「X」，故让它们首尾相接成折返路径。
  -->
  <g stroke-width="21" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 第一条折返：红→蓝 -->
    <path d="M132 232 L212 152 L292 232" stroke="#E42A2A"/>
    <path d="M292 232 L372 152" stroke="#1B34D6"/>

    <!-- 第二条折返：蓝→红 -->
    <path d="M132 312 L212 232" stroke="#1B34D6"/>
    <path d="M212 232 L292 312" stroke="#E42A2A"/>
    <path d="M292 312 L372 232" stroke="#1B34D6"/>

    <!-- 第三条折返 -->
    <path d="M172 372 L252 292" stroke="#E42A2A"/>
    <path d="M252 292 L332 372" stroke="#1B34D6"/>
  </g>

  <!--
    翻起的纸角：右上角折起，露出下方的背面。
    这是「折叠」最直观的符号 —— 纸真的被折起来了。
  -->
  <path d="M288 92 L420 92 L420 224 Z" fill="url(#back)"/>
  <path d="M288 92 L420 224" stroke="#FFFFFF" stroke-width="11"
        stroke-linecap="round" fill="none"/>
</svg>